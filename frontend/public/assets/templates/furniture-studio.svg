<svg width="480" height="300" viewBox="0 0 480 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="furn-bg" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EBE1"/>
    </linearGradient>
  </defs>
  <!-- Card Canvas -->
  <rect width="480" height="300" fill="url(#furn-bg)"/>

  <!-- Browser Header -->
  <rect width="480" height="32" fill="#FFFFFF"/>
  <circle cx="20" cy="16" r="4" fill="#E2E8F0"/>
  <circle cx="34" cy="16" r="4" fill="#E2E8F0"/>
  <circle cx="48" cy="16" r="4" fill="#E2E8F0"/>
  <rect x="150" y="8" width="180" height="16" rx="8" fill="#F8FAFC"/>
  <text x="180" y="20" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8">nordic-living.webcraft.ai</text>

  <!-- Website Navbar -->
  <rect y="32" width="480" height="36" fill="#FAF8F5"/>
  <text x="24" y="55" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#292524" letter-spacing="2">NORDIC·STUDIO</text>
  <text x="175" y="54" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Chairs</text>
  <text x="220" y="54" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Tables</text>
  <text x="265" y="54" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Lounge</text>
  <text x="315" y="54" font-family="Inter, sans-serif" font-size="9" fill="#78716C">Spaces</text>
  <circle cx="445" cy="50" r="12" fill="#292524"/>
  <text x="442" y="54" font-family="Inter, sans-serif" font-size="9" fill="#FFFFFF">1</text>

  <!-- Hero Content -->
  <text x="24" y="100" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#A8A29E" letter-spacing="2">CRAFTED IN COPENHAGEN</text>
  <text x="24" y="130" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1C1917">The Oak Lounge<br/>Collection</text>
  <text x="24" y="172" font-family="Inter, sans-serif" font-size="10" fill="#78716C">Sustainably sourced European solid oak with<br/>hand-stitched saddle leather.</text>

  <rect x="24" y="200" width="100" height="32" rx="4" fill="#292524"/>
  <text x="38" y="220" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Explore Pieces</text>

  <!-- 3D Furniture Visual Mockup -->
  <g transform="translate(260, 80)">
    <rect width="195" height="185" rx="12" fill="#FFFFFF" stroke="#E7E5E4" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.04))"/>
    <!-- Minimalist Chair Visual -->
    <ellipse cx="98" cy="145" rx="55" ry="12" fill="#E7E5E4"/>
    <!-- Chair Cushion -->
    <rect x="58" y="90" width="80" height="28" rx="8" fill="#D6C7B2"/>
    <!-- Chair Backrest -->
    <rect x="68" y="45" width="60" height="48" rx="6" fill="#C4B59D"/>
    <!-- Legs -->
    <line x1="68" y1="118" x2="55" y2="148" stroke="#44403C" stroke-width="4" stroke-linecap="round"/>
    <line x1="128" y1="118" x2="140" y2="148" stroke="#44403C" stroke-width="4" stroke-linecap="round"/>
    <line x1="78" y1="118" x2="72" y2="142" stroke="#44403C" stroke-width="3" stroke-linecap="round"/>
    <line x1="118" y1="118" x2="124" y2="142" stroke="#44403C" stroke-width="3" stroke-linecap="round"/>

    <text x="20" y="170" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1C1917">Freja Armchair</text>
    <text x="145" y="170" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#78716C">$420</text>
  </g>
</svg>
