<svg width="480" height="300" viewBox="0 0 480 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fash-bg" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#fash-bg)"/>

  <!-- Browser Header -->
  <rect width="480" height="32" fill="#FFFFFF"/>
  <circle cx="20" cy="16" r="4" fill="#FBBF24"/>
  <circle cx="34" cy="16" r="4" fill="#FBBF24"/>
  <circle cx="48" cy="16" r="4" fill="#FBBF24"/>
  <rect x="150" y="8" width="180" height="16" rx="8" fill="#F3F4F6"/>
  <text x="185" y="20" font-family="Inter, sans-serif" font-size="8" fill="#9CA3AF">vogue-studio.webcraft.ai</text>

  <!-- Navbar -->
  <rect y="32" width="480" height="36" fill="#FFFFFF" fill-opacity="0.8"/>
  <text x="24" y="55" font-family="Inter, sans-serif" font-size="13" font-weight="900" fill="#18181B" letter-spacing="3">VELOUR</text>
  <text x="160" y="54" font-family="Inter, sans-serif" font-size="9" fill="#52525B">New In</text>
  <text x="210" y="54" font-family="Inter, sans-serif" font-size="9" fill="#52525B">Women</text>
  <text x="260" y="54" font-family="Inter, sans-serif" font-size="9" fill="#52525B">Men</text>
  <text x="295" y="54" font-family="Inter, sans-serif" font-size="9" fill="#DC2626">Sale 40%</text>
  <circle cx="445" cy="50" r="12" fill="#18181B"/>
  <text x="442" y="54" font-family="Inter, sans-serif" font-size="9" fill="#FFFFFF">2</text>

  <!-- Hero Content -->
  <rect x="24" y="85" width="100" height="18" rx="4" fill="#FEF08A"/>
  <text x="32" y="97" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#854D0E">AUTUMN / WINTER 26</text>

  <text x="24" y="130" font-family="Inter, sans-serif" font-size="20" font-weight="900" fill="#09090B">Minimalist Luxury<br/>Streetwear</text>
  <text x="24" y="170" font-family="Inter, sans-serif" font-size="10" fill="#71717A">Tailored overcoats and heavyweight organic<br/>cotton essentials.</text>

  <rect x="24" y="198" width="110" height="32" rx="4" fill="#18181B"/>
  <text x="38" y="218" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Shop Collection</text>

  <!-- Visual Mockup -->
  <g transform="translate(265, 80)">
    <rect width="190" height="185" rx="12" fill="#FFFFFF" stroke="#FDE68A" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))"/>
    <!-- Fashion Model / Coat Illustration -->
    <rect x="55" y="20" width="80" height="120" rx="10" fill="#D97706" opacity="0.85"/>
    <circle cx="95" cy="40" r="16" fill="#FDE68A"/>
    <path d="M75 55 L95 100 L115 55" stroke="#78350F" stroke-width="3"/>
    <rect x="20" y="150" width="150" height="24" rx="4" fill="#FEF3C7"/>
    <text x="30" y="165" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#78350F">Wool Trench Coat · $280</text>
  </g>
</svg>
