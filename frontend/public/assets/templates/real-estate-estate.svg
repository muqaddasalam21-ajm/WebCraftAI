<svg width="480" height="300" viewBox="0 0 480 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="real-bg" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="blue-ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#real-bg)"/>

  <!-- Browser Header -->
  <rect width="480" height="32" fill="#FFFFFF"/>
  <circle cx="20" cy="16" r="4" fill="#93C5FD"/>
  <circle cx="34" cy="16" r="4" fill="#93C5FD"/>
  <circle cx="48" cy="16" r="4" fill="#93C5FD"/>
  <rect x="150" y="8" width="180" height="16" rx="8" fill="#F3F4F6"/>
  <text x="180" y="20" font-family="Inter, sans-serif" font-size="8" fill="#9CA3AF">haven-villas.webcraft.ai</text>

  <!-- Navbar -->
  <rect y="32" width="480" height="36" fill="#FFFFFF" fill-opacity="0.8"/>
  <text x="24" y="55" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1E3A8A" letter-spacing="1">HAVEN·REALTY</text>
  <text x="160" y="54" font-family="Inter, sans-serif" font-size="9" fill="#3B82F6">Villas</text>
  <text x="210" y="54" font-family="Inter, sans-serif" font-size="9" fill="#3B82F6">Penthouse</text>
  <text x="280" y="54" font-family="Inter, sans-serif" font-size="9" fill="#3B82F6">Virtual Tour</text>
  <rect x="385" y="42" width="70" height="20" rx="6" fill="url(#blue-ocean)"/>
  <text x="395" y="55" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">Contact Agent</text>

  <!-- Content -->
  <rect x="24" y="85" width="120" height="18" rx="4" fill="#BFDBFE"/>
  <text x="32" y="97" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#1E40AF">🏖️ MEDITERRANEAN ESTATES</text>

  <text x="24" y="130" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#172554">Architectural Luxury<br/>Waterfront Living</text>
  <text x="24" y="170" font-family="Inter, sans-serif" font-size="10" fill="#3B82F6">Curated collection of private infinity pool villas<br/>in Cannes, Amalfi and Santorini.</text>

  <rect x="24" y="198" width="115" height="32" rx="6" fill="url(#blue-ocean)"/>
  <text x="38" y="218" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">View 48 Listings</text>

  <!-- Visual Mockup -->
  <g transform="translate(265, 80)">
    <rect width="190" height="185" rx="14" fill="#FFFFFF" stroke="#BFDBFE" filter="drop-shadow(0 10px 15px rgba(37,99,235,0.1))"/>
    <rect x="15" y="15" width="160" height="90" rx="8" fill="#DBEAFE"/>
    <!-- Villa Architecture Lines -->
    <rect x="35" y="35" width="120" height="60" rx="4" fill="#FFFFFF"/>
    <rect x="45" y="45" width="40" height="40" fill="#93C5FD" opacity="0.6"/>
    <rect x="95" y="45" width="50" height="40" fill="#60A5FA" opacity="0.6"/>
    <rect x="15" y="118" width="160" height="16" rx="4" fill="#EFF6FF"/>
    <text x="25" y="130" font-family="Inter, sans-serif" font-size="8" font-weight="800" fill="#1E40AF">Villa Bellissima · $3,450,000</text>
    <text x="25" y="150" font-family="Inter, sans-serif" font-size="7" fill="#64748B">5 Beds · 6 Baths · 6,800 sq ft</text>
  </g>
</svg>
