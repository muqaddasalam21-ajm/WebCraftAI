<svg width="480" height="300" viewBox="0 0 480 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="port-grad" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="purple-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#port-grad)"/>

  <!-- Browser Header -->
  <rect width="480" height="32" fill="#FFFFFF"/>
  <circle cx="20" cy="16" r="4" fill="#C4B5FD"/>
  <circle cx="34" cy="16" r="4" fill="#C4B5FD"/>
  <circle cx="48" cy="16" r="4" fill="#C4B5FD"/>
  <rect x="150" y="8" width="180" height="16" rx="8" fill="#F3F4F6"/>
  <text x="180" y="20" font-family="Inter, sans-serif" font-size="8" fill="#9CA3AF">alex-design.webcraft.ai</text>

  <!-- Navbar -->
  <rect y="32" width="480" height="36" fill="#FFFFFF" fill-opacity="0.6"/>
  <text x="24" y="55" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#4C1D95">ALEX.UI</text>
  <text x="170" y="54" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#6D28D9">Selected Work</text>
  <text x="245" y="54" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">About</text>
  <text x="290" y="54" font-family="Inter, sans-serif" font-size="9" fill="#6B7280">Journal</text>
  <rect x="390" y="40" width="66" height="20" rx="10" fill="#4C1D95"/>
  <text x="403" y="54" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">Let's Talk</text>

  <!-- Content -->
  <rect x="24" y="80" width="130" height="18" rx="9" fill="#DDD6FE"/>
  <text x="34" y="92" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#6D28D9">● AVAILABLE FOR Q4</text>
  
  <text x="24" y="125" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#1F2937">Design Director &amp;<br/>Creative Technologist</text>
  <text x="24" y="165" font-family="Inter, sans-serif" font-size="10" fill="#6B7280">Crafting high-impact digital experiences<br/>for world-leading AI &amp; Web3 startups.</text>

  <!-- Metric Badges -->
  <g transform="translate(24, 195)">
    <rect width="65" height="40" rx="8" fill="#FFFFFF"/>
    <text x="12" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#7C3AED">12+</text>
    <text x="12" y="32" font-family="Inter, sans-serif" font-size="7" fill="#6B7280">Awwwards</text>

    <rect x="75" width="65" height="40" rx="8" fill="#FFFFFF"/>
    <text x="87" y="18" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#EC4899">$40M+</text>
    <text x="87" y="32" font-family="Inter, sans-serif" font-size="7" fill="#6B7280">Client Value</text>
  </g>

  <!-- Portfolio Card Visual -->
  <g transform="translate(265, 80)">
    <rect width="190" height="185" rx="14" fill="url(#purple-pink)" filter="drop-shadow(0 10px 20px rgba(139,92,246,0.25))"/>
    <rect x="15" y="15" width="160" height="105" rx="8" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="35" cy="35" r="10" fill="#8B5CF6"/>
    <rect x="55" y="28" width="80" height="6" rx="3" fill="#1F2937"/>
    <rect x="55" y="38" width="60" height="4" rx="2" fill="#9CA3AF"/>
    <rect x="25" y="60" width="140" height="45" rx="6" fill="#F3F4F6"/>
    
    <text x="15" y="145" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Nova AI Platform</text>
    <text x="15" y="160" font-family="Inter, sans-serif" font-size="8" fill="#EDE9FE">Brand Identity &amp; SaaS Application</text>
  </g>
