<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="h-bg-glow" x1="100" y1="100" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="laptop-base" x1="120" y1="360" x2="480" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="150" y1="120" x2="450" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="card-shadow" x="0" y="0" width="600" height="500" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4C1D95" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="300" cy="250" r="180" fill="url(#h-bg-glow)" filter="blur(40px)"/>

  <!-- Floating 3D Geometric Accents -->
  <g transform="translate(480, 80) rotate(15)">
    <rect width="60" height="60" rx="16" fill="url(#brand-grad)" opacity="0.9"/>
    <path d="M30 18L33 27L42 30L33 33L30 42L27 33L18 30L27 27L30 18Z" fill="white"/>
  </g>

  <g transform="translate(60, 280) rotate(-12)">
    <rect width="70" height="70" rx="20" fill="url(#cyan-grad)" opacity="0.9"/>
    <circle cx="35" cy="35" r="16" stroke="white" stroke-width="4" stroke-dasharray="8 4"/>
    <circle cx="35" cy="35" r="6" fill="white"/>
  </g>

  <!-- 3D Laptop Screen & Body -->
  <g filter="url(#card-shadow)">
    <!-- Laptop Screen Lid -->
    <rect x="140" y="100" width="320" height="230" rx="16" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="150" y="112" width="300" height="206" rx="10" fill="url(#screen-grad)"/>

    <!-- Screen Website Mockup Elements -->
    <!-- Navbar mock -->
    <rect x="165" y="125" width="40" height="10" rx="4" fill="#8B5CF6"/>
    <rect x="220" y="127" width="25" height="6" rx="3" fill="#64748B"/>
    <rect x="255" y="127" width="25" height="6" rx="3" fill="#64748B"/>
    <rect x="290" y="127" width="25" height="6" rx="3" fill="#64748B"/>
    <rect x="400" y="124" width="35" height="12" rx="4" fill="#EC4899"/>

    <!-- Hero section in screen -->
    <rect x="165" y="150" width="130" height="16" rx="4" fill="#FFFFFF"/>
    <rect x="165" y="172" width="100" height="8" rx="3" fill="#94A3B8"/>
    <rect x="165" y="185" width="80" height="8" rx="3" fill="#94A3B8"/>
    <rect x="165" y="202" width="55" height="16" rx="6" fill="#8B5CF6"/>
    <rect x="225" y="202" width="50" height="16" rx="6" fill="#334155"/>

    <!-- Hero Image Card in screen -->
    <rect x="310" y="150" width="125" height="70" rx="8" fill="url(#cyan-grad)" opacity="0.8"/>
    <circle cx="340" cy="185" r="14" fill="#FFFFFF" opacity="0.3"/>
    <rect x="365" y="175" width="55" height="8" rx="4" fill="#FFFFFF" opacity="0.7"/>
    <rect x="365" y="188" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.5"/>

    <!-- Features 3-col preview in screen -->
    <rect x="165" y="235" width="80" height="65" rx="6" fill="#1E293B" stroke="#334155"/>
    <circle cx="180" cy="250" r="6" fill="#8B5CF6"/>
    <rect x="175" y="262" width="60" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="175" y="272" width="45" height="5" rx="2" fill="#64748B"/>

    <rect x="260" y="235" width="80" height="65" rx="6" fill="#1E293B" stroke="#334155"/>
    <circle cx="275" cy="250" r="6" fill="#EC4899"/>
    <rect x="270" y="262" width="60" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="270" y="272" width="45" height="5" rx="2" fill="#64748B"/>

    <rect x="355" y="235" width="80" height="65" rx="6" fill="#1E293B" stroke="#334155"/>
    <circle cx="370" cy="250" r="6" fill="#06B6D4"/>
    <rect x="365" y="262" width="60" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="365" y="272" width="45" height="5" rx="2" fill="#64748B"/>

    <!-- Laptop Base -->
    <path d="M100 330H500L470 365H130L100 330Z" fill="url(#laptop-base)"/>
    <rect x="260" y="333" width="80" height="5" rx="2.5" fill="#475569"/>
    <rect x="110" y="365" width="380" height="8" rx="4" fill="#0F172A"/>
  </g>

  <!-- Floating Holographic UI Layer 1 (Left) -->
  <g transform="translate(80, 140)">
    <rect width="130" height="85" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.08))"/>
    <circle cx="28" cy="28" r="12" fill="#8B5CF6"/>
    <path d="M28 20L29.5 25.5L35 27L29.5 28.5L28 34L26.5 28.5L21 27L26.5 25.5L28 20Z" fill="white"/>
    <text x="48" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0F172A">AI Builder</text>
    <text x="48" y="38" font-family="Inter, sans-serif" font-size="8" fill="#64748B">Generating pages...</text>
    <!-- Progress bar -->
    <rect x="18" y="55" width="94" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="18" y="55" width="80" height="6" rx="3" fill="url(#brand-grad)"/>
    <text x="18" y="74" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#10B981">94% Complete</text>
  </g>

  <!-- Floating Holographic UI Layer 2 (Right) -->
  <g transform="translate(420, 220)">
    <rect width="140" height="95" rx="14" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2E8F0" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.08))"/>
    <rect x="16" y="16" width="30" height="30" rx="8" fill="url(#cyan-grad)"/>
    <path d="M26 26L31 31M36 21L31 31" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0F172A">WebCraft AI</text>
    <text x="54" y="40" font-family="Inter, sans-serif" font-size="8" fill="#10B981">● Ready to deploy</text>
    <!-- Badges -->
    <rect x="16" y="58" width="50" height="18" rx="6" fill="#F5F3FF"/>
    <text x="24" y="70" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#7C3AED">Responsive</text>
    <rect x="72" y="58" width="48" height="18" rx="6" fill="#ECFDF5"/>
    <text x="80" y="70" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#059669">Fast 99</text>
  </g>
</svg>
