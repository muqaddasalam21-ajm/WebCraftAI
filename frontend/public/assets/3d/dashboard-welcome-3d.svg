<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dw-g1" x1="20" y1="20" x2="220" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="dw-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="120" cy="90" r="70" fill="#EDE9FE" opacity="0.8"/>

  <!-- 3D Isometric Platform -->
  <path d="M120 40L200 85L120 130L40 85L120 40Z" fill="url(#dw-g1)" opacity="0.95"/>
  <path d="M40 85L120 130V145L40 100V85Z" fill="#4C1D95"/>
  <path d="M200 85L120 130V145L200 100V85Z" fill="#312E81"/>

  <!-- Floating Holographic 3D Cards on Platform -->
  <!-- Center Screen Card -->
  <g transform="translate(85, 45)">
    <rect width="70" height="50" rx="8" fill="#FFFFFF" filter="drop-shadow(0 8px 12px rgba(0,0,0,0.15))"/>
    <rect x="8" y="8" width="20" height="6" rx="3" fill="#8B5CF6"/>
    <rect x="8" y="18" width="54" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="8" y="26" width="36" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="8" y="34" width="24" height="8" rx="4" fill="#EC4899"/>
  </g>

  <!-- Left Floating Sphere -->
  <circle cx="50" cy="55" r="16" fill="url(#dw-cyan)" filter="drop-shadow(0 4px 8px rgba(6,182,212,0.4))"/>
  <circle cx="45" cy="50" r="5" fill="white" opacity="0.6"/>

  <!-- Right Floating Sparkle Cube -->
  <g transform="translate(170, 45) rotate(15)">
    <rect width="24" height="24" rx="6" fill="#F43F5E" filter="drop-shadow(0 4px 8px rgba(244,63,94,0.35))"/>
    <path d="M12 4L13.5 10.5L20 12L13.5 13.5L12 20L10.5 13.5L4 12L10.5 10.5L12 4Z" fill="white"/>
  </g>

  <!-- Floating Mini Chart -->
  <g transform="translate(140, 95)">
    <rect width="50" height="35" rx="6" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <rect x="8" y="20" width="6" height="10" rx="2" fill="#CBD5E1"/>
    <rect x="18" y="14" width="6" height="16" rx="2" fill="#8B5CF6"/>
    <rect x="28" y="10" width="6" height="20" rx="2" fill="#EC4899"/>
    <rect x="38" y="6" width="6" height="24" rx="2" fill="#10B981"/>
  </g>
</svg>
